<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F1A">
  <title>NayaGram — Verification codes</title>
  <meta name="description" content="Live verification codes for the NayaGram test account. Refreshes automatically every 25 seconds.">
  <meta property="og:title" content="NayaGram — Verification codes">
  <meta property="og:description" content="Live verification codes for the NayaGram test account. All times are in UTC.">
  <meta property="og:image" content="https://i.postimg.cc/28x52GSZ/NG-Cyan-Logo.png">
  <link rel="icon" type="image/png" href="./assets/ng-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0F1A;
      --surface: #111B2E;
      --surface-hover: #182742;
      --surface-subtle: #0D1524;
      --otp-well: #070C15;
      --otp-border: #1E4E75;
      --border: #1E2E4A;
      --border-strong: #2E466E;
      --text: #FFFFFF;
      --text-secondary: #E2ECF8;
      --text-muted: #B0C4DE;
      --brand-accent: #38BDF8;
      --title-color: #38BDF8;
      --accent: #0EA5E9;
      --accent-hover: #38BDF8;
      --accent-text: #031320;
      --otp-color: #FFFFFF;
      --live: #22C55E;
      --copied-bg: #16A34A;
      --copied-text: #FFFFFF;
      --warn: #FBBF24;
      --theme-btn-bg: #16233B;
      --theme-btn-color: #FCD34D;
      --seg-bg: #0D1524;
      --seg-active-bg: #0EA5E9;
      --seg-active-text: #031320;
      --focus-ring: rgba(56, 189, 248, 0.6);
      --logo-shadow: 0 10px 26px -6px rgba(14, 165, 233, 0.45);
      --panel-shadow: 0 18px 42px -20px rgba(0, 0, 0, 0.75);
      --radius-lg: 18px;
      --radius-md: 12px;
      --font-sans: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    [data-theme="light"] {
      --bg: #F2F6FB;
      --surface: #FFFFFF;
      --surface-hover: #EAF2FA;
      --surface-subtle: #F7FAFE;
      --otp-well: #EDF6FF;
      --otp-border: #7DD3FC;
      --border: #CBD9E8;
      --border-strong: #94B4D4;
      --text: #0A1628;
      --text-secondary: #1E324B;
      --text-muted: #425B78;
      --brand-accent: #0284C7;
      --title-color: #0369A1;
      --accent: #0284C7;
      --accent-hover: #0369A1;
      --accent-text: #FFFFFF;
      --otp-color: #0369A1;
      --live: #15803D;
      --copied-bg: #15803D;
      --copied-text: #FFFFFF;
      --warn: #B45309;
      --theme-btn-bg: #E6EFF8;
      --theme-btn-color: #0369A1;
      --seg-bg: #E2ECF6;
      --seg-active-bg: #0284C7;
      --seg-active-text: #FFFFFF;
      --focus-ring: rgba(2, 132, 199, 0.45);
      --logo-shadow: 0 10px 22px -6px rgba(2, 132, 199, 0.28);
      --panel-shadow: 0 14px 36px -20px rgba(10, 22, 40, 0.18);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
      overscroll-behavior-x: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      overscroll-behavior-x: none;
      touch-action: pan-y;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      transition: background-color 180ms ease, color 180ms ease;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 18px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      min-width: 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand-logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 2px solid var(--accent);
      box-shadow: var(--logo-shadow);
    }

    .brand-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-logo-fallback {
      display: none;
      font-weight: 800;
      font-size: 24px;
      color: var(--brand-accent);
    }

    .brand-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }

    .brand-name-accent {
      color: var(--brand-accent);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Upgraded Sleek Dark / Light Theme Toggle */
    .theme-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 44px;
      height: 44px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--theme-btn-bg);
      color: var(--theme-btn-color);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 160ms ease, border-color 160ms ease, transform 120ms ease;
    }

    .theme-btn:hover {
      border-color: var(--accent);
    }

    .theme-btn:active {
      transform: scale(0.96);
    }

    .theme-btn:focus-visible,
    .seg-btn:focus-visible,
    .btn:focus-visible,
    .footer-link:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      background: var(--seg-bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      gap: 2px;
    }

    .seg-btn {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      padding: 8px 12px;
      min-height: 36px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .seg-btn:hover:not(.active) {
      color: var(--text);
    }

    .seg-btn.active {
      background: var(--seg-active-bg);
      color: var(--seg-active-text);
    }

    /* Compact High-Contrast Title Block */
    .hero {
      padding: 20px 0 14px;
    }

    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(1.95rem, 5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--title-color);
      text-wrap: balance;
    }

    .hero-sub {
      margin: 0;
      color: var(--text-secondary);
      font-size: 15.5px;
      font-weight: 500;
      line-height: 1.45;
    }

    /* Tight Single-Line Live Status Bar */
    .status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
      padding: 6px 0 14px;
    }

    .status-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 9px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      min-width: 0;
    }

    .live-group {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--live);
      font-weight: 700;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--live);
      flex-shrink: 0;
    }

    .live-dot.reconnecting {
      background: var(--warn);
    }

    .sep {
      color: var(--text-muted);
      user-select: none;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: transparent;
      color: var(--accent-text);
      min-height: 50px;
      padding: 10px 22px;
      font-size: 15.5px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: transparent;
    }

    .btn-copied {
      background: var(--copied-bg) !important;
      color: var(--copied-text) !important;
      border-color: transparent !important;
    }

    .spin {
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Main Above-the-Fold OTP Panel */
    .panel {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--panel-shadow);
      overflow: hidden;
    }

    .progress-track {
      height: 3px;
      width: 100%;
      background: var(--surface-subtle);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: var(--brand-accent);
      transform-origin: left center;
      transform: scaleX(0);
    }

    .error-banner {
      display: none;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--warn);
      border-bottom: 1px solid var(--border);
      background: rgba(251, 191, 36, 0.08);
    }

    .error-banner.visible {
      display: block;
    }

    /* Prominent Single-Line OTP Copy Box */
    .otp-stage {
      padding: 22px 20px;
    }

    .otp-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px 12px;
      margin-bottom: 14px;
    }

    .otp-stage-label {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--brand-accent);
    }

    .otp-sender {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .otp-copy-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px;
      border-radius: 14px;
      background: var(--otp-well);
      border: 2px solid var(--otp-border);
      min-width: 0;
    }

    .otp-copy-row.waiting {
      border-color: var(--border-strong);
      border-style: dashed;
    }

    .otp-digits {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: clamp(2rem, 8.5vw, 3.3rem);
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--otp-color);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      user-select: all;
    }

    .otp-digits.placeholder {
      color: var(--text-muted);
      letter-spacing: 0.14em;
      user-select: none;
    }

    .otp-meta {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px 9px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .empty-helper {
      margin: 14px 0 0;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Previous Recent Codes */
    .history-header {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .codes-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .code-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
    }

    .code-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .code-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--otp-color);
      line-height: 1.15;
    }

    .code-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .skeleton-wrap {
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .skeleton-line {
      height: 16px;
      border-radius: 6px;
      background: var(--surface-hover);
      width: 55%;
    }

    .skeleton-line.wide {
      height: 48px;
      width: 44%;
    }

    /* Ultra-Clean Minimal Footer (No GitHub Link) */
    .footer {
      margin-top: auto;
      padding-top: 26px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13.5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .footer-line {
      margin: 0;
      line-height: 1.5;
    }

    .footer-link {
      color: var(--brand-accent);
      text-decoration: none;
      font-weight: 700;
    }

    .footer-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 560px) {
      .container {
        padding: 14px 14px 24px;
      }
      .topbar {
        padding-bottom: 14px;
        gap: 8px;
      }
      .brand {
        gap: 10px;
      }
      .brand-logo-wrap {
        width: 58px;
        height: 58px;
        border-radius: 15px;
      }
      .brand-name {
        font-size: 22px;
      }
      .theme-label {
        display: none;
      }
      .theme-btn {
        padding: 0;
        width: 42px;
        height: 42px;
      }
      .seg-btn {
        padding: 7px 10px;
        font-size: 13px;
      }
      .hero {
        padding: 16px 0 10px;
      }
      .status-row {
        padding: 4px 0 12px;
      }
      .otp-stage {
        padding: 18px 14px;
      }
      .otp-copy-row {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
        padding: 16px 14px;
        gap: 12px;
      }
      .otp-copy-row .btn {
        width: 100%;
      }
      .code-item {
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .progress-bar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a class="brand" href="./" aria-label="NayaGram Verification codes">
        <span class="brand-logo-wrap">
          <img
            class="brand-logo"
            src="./assets/ng-logo.png"
            alt="NayaGram official logo"
            referrerpolicy="no-referrer"
            onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='https://i.postimg.cc/28x52GSZ/NG-Cyan-Logo.png';}else{this.style.display='none';this.nextElementSibling.style.display='block';}"
          >
          <span class="brand-logo-fallback" aria-hidden="true">NG</span>
        </span>
        <span class="brand-name">Naya<span class="brand-name-accent">Gram</span></span>
      </a>

      <div class="header-controls">
        <button
          id="themeToggle"
          class="theme-btn"
          type="button"
          aria-label="Toggle dark or light theme"
          title="Switch Dark / Light mode"
        >
          <span id="themeIcon" aria-hidden="true"></span>
          <span id="themeLabel" class="theme-label">Light</span>
        </button>

        <div class="segmented" role="group" aria-label="Language">
          <button id="langEn" class="seg-btn active" type="button" data-lang="en">EN</button>
          <button id="langBn" class="seg-btn" type="button" data-lang="bn">বাংলা</button>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1 id="pageTitle">Verification codes</h1>
        <p id="pageSubtitle" class="hero-sub">
          Login codes for the NayaGram test account · Newest first · Auto-refresh 25 s
        </p>
      </section>

      <section class="status-row" aria-label="Live refresh status">
        <div class="status-meta">
          <span class="live-group">
            <span id="liveDot" class="live-dot" aria-hidden="true"></span>
            <span id="liveText">Live</span>
          </span>
          <span class="sep" aria-hidden="true">·</span>
          <span id="countdownText" class="mono">25s</span>
          <span class="sep" aria-hidden="true">·</span>
          <span id="lastRefreshedTime" class="mono">--.--.----, --:--:-- UTC</span>
        </div>

        <button id="refreshBtn" class="btn" type="button">
          <svg id="refreshIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
          </svg>
          <span id="refreshBtnLabel">Refresh</span>
        </button>
      </section>

      <section class="panel" aria-live="polite" aria-atomic="false">
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="errorBanner" class="error-banner" role="status"></div>

        <div id="codesContainer">
          <div class="skeleton-wrap" aria-label="Loading verification codes">
            <div class="skeleton-line wide"></div>
            <div class="skeleton-line"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p id="footerLine1" class="footer-line">
        All times are in UTC &middot; <a class="footer-link" href="https://play.google.com/store/apps/details?id=org.nayagram.platform" target="_blank" rel="noopener noreferrer">Google Play</a>
      </p>
      <p id="footerCopy" class="footer-line">
        &copy; 2026 NayaGram &middot; Unofficial Telegram client, not affiliated with Telegram FZ-LLC.
      </p>
    </footer>
  </div>

  <script>
    (function () {
      const REFRESH_SECONDS = 25;
      const REFRESH_INTERVAL_MS = REFRESH_SECONDS * 1000;
      const RAW_API_URL = "https://api.github.com/repos/NayaGramPlatform/ALAPGRAM/contents/codes.json";
      const LOCAL_JSON_URL = "./codes.json";

      const SUN_SVG = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>';
      const MOON_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>';

      const I18N = {
        en: {
          docTitle: "NayaGram — Verification codes",
          title: "Verification codes",
          subtitle: "Login codes for the NayaGram test account · Newest first · Auto-refresh 25 s",
          live: "Live",
          reconnecting: "Reconnecting",
          nextIn: (s) => `Next ${s}s`,
          refresh: "Refresh",
          themeLight: "Light",
          themeDark: "Dark",
          latestOtpLabel: "Latest OTP code",
          waitingOtpLabel: "Waiting for OTP code",
          senderTag: "Official +42777",
          waitingBtn: "Waiting…",
          copyOtp: "Copy OTP",
          copy: "Copy",
          copied: "Copied!",
          recentHistory: "Previous codes",
          emptyPrimary: "No codes yet. Request a login code in NayaGram and it will appear here.",
          offlineNotice: "Connection lost. Retrying automatically every 25 s.",
          footerUtcPrefix: "All times are in UTC · ",
          footerCopy: "© 2026 NayaGram · Unofficial Telegram client, not affiliated with Telegram FZ-LLC.",
          justNow: "Just now",
          secAgo: (n) => `${n}s ago`,
          minAgo: (n) => `${n}m ago`
        },
        bn: {
          docTitle: "NayaGram — ভেরিফিকেশন কোড",
          title: "ভেরিফিকেশন কোড",
          subtitle: "NayaGram টেস্ট অ্যাকাউন্টের লগইন কোড · নতুন কোড আগে · অটো-রিফ্রেশ ২৫ সে.",
          live: "লাইভ",
          reconnecting: "পুনঃসংযোগ",
          nextIn: (s) => `${s} সে.`,
          refresh: "রিফ্রেশ",
          themeLight: "লাইট",
          themeDark: "ডার্ক",
          latestOtpLabel: "সর্বশেষ OTP কোড",
          waitingOtpLabel: "OTP কোডের অপেক্ষায়",
          senderTag: "অফিশিয়াল +42777",
          waitingBtn: "অপেক্ষায়…",
          copyOtp: "OTP কপি",
          copy: "কপি",
          copied: "কপি হয়েছে!",
          recentHistory: "আগের কোডসমূহ",
          emptyPrimary: "এখনও কোনো কোড আসেনি। NayaGram অ্যাপে কোড পাঠালে এখানে দেখাবে।",
          offlineNotice: "সংযোগ বিচ্ছিন্ন হয়েছে। প্রতি ২৫ সেকেন্ডে চেষ্টা করা হচ্ছে।",
          footerUtcPrefix: "সব সময় UTC অনুযায়ী · ",
          footerCopy: "© ২০২৬ NayaGram · আনঅফিশিয়াল Telegram ক্লায়েন্ট, Telegram FZ-LLC-এর সাথে সম্পর্কিত নয়।",
          justNow: "এইমাত্র",
          secAgo: (n) => `${n} সে. আগে`,
          minAgo: (n) => `${n} মি. আগে`
        }
      };

      const state = {
        lang: localStorage.getItem("ng_verify_lang") === "bn" ? "bn" : "en",
        theme: localStorage.getItem("ng_verify_theme") === "light" ? "light" : "dark",
        etag: null,
        apiRateLimitedUntil: 0,
        ttlMinutes: 30,
        codes: [],
        lastRefreshed: null,
        secondsLeft: REFRESH_SECONDS,
        online: true,
        loadedOnce: false,
        fetching: false
      };

      const $ = (id) => document.getElementById(id);

      function formatUtcTimestamp(date) {
        const d = date instanceof Date ? date : new Date(date);
        if (isNaN(d.getTime())) return "--.--.----, --:--:-- UTC";
        const pad = (n) => String(n).padStart(2, "0");
        return `${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.${d.getUTCFullYear()}, ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
      }

      function formatRelative(isoStr) {
        const t = I18N[state.lang];
        const ts = new Date(isoStr).getTime();
        if (isNaN(ts)) return "";
        const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        if (diffSec < 10) return t.justNow;
        if (diffSec < 60) return t.secAgo(diffSec);
        return t.minAgo(Math.floor(diffSec / 60));
      }

      function restartProgressBar() {
        const bar = $("progressBar");
        if (!bar) return;
        bar.style.transition = "none";
        bar.style.transform = "scaleX(0)";
        void bar.offsetWidth;
        bar.style.transition = `transform ${REFRESH_INTERVAL_MS}ms linear`;
        bar.style.transform = "scaleX(1)";
      }

      function updateThemeButton() {
        const t = I18N[state.lang];
        const isDark = state.theme === "dark";
        $("themeIcon").innerHTML = isDark ? SUN_SVG : MOON_SVG;
        $("themeLabel").textContent = isDark ? t.themeLight : t.themeDark;
      }

      function applyTheme(theme) {
        state.theme = theme === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", state.theme);
        localStorage.setItem("ng_verify_theme", state.theme);
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute("content", state.theme === "light" ? "#F2F6FB" : "#0A0F1A");
        }
        updateThemeButton();
      }

      function applyLanguage(lang) {
        state.lang = lang === "bn" ? "bn" : "en";
        document.documentElement.setAttribute("lang", state.lang);
        localStorage.setItem("ng_verify_lang", state.lang);
        const t = I18N[state.lang];

        document.title = t.docTitle;
        $("pageTitle").textContent = t.title;
        $("pageSubtitle").textContent = t.subtitle;
        $("refreshBtnLabel").textContent = t.refresh;
        $("footerCopy").textContent = t.footerCopy;

        const f1 = $("footerLine1");
        f1.textContent = "";
        f1.appendChild(document.createTextNode(t.footerUtcPrefix));
        const a = document.createElement("a");
        a.className = "footer-link";
        a.href = "https://play.google.com/store/apps/details?id=org.nayagram.platform";
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "Google Play";
        f1.appendChild(a);

        $("langEn").classList.toggle("active", state.lang === "en");
        $("langBn").classList.toggle("active", state.lang === "bn");

        updateThemeButton();
        updateStatusUI();
        renderCodes();
      }

      function updateStatusUI() {
        const t = I18N[state.lang];
        $("liveText").textContent = state.online ? t.live : t.reconnecting;
        $("liveDot").classList.toggle("reconnecting", !state.online);
        $("countdownText").textContent = t.nextIn(state.secondsLeft);
        $("lastRefreshedTime").textContent = state.lastRefreshed
          ? formatUtcTimestamp(state.lastRefreshed)
          : "--.--.----, --:--:-- UTC";

        const banner = $("errorBanner");
        if (!state.online) {
          banner.textContent = t.offlineNotice;
          banner.classList.add("visible");
        } else {
          banner.classList.remove("visible");
        }
      }

      function getActiveCodes() {
        const cutoff = Date.now() - (state.ttlMinutes || 30) * 60 * 1000;
        return (state.codes || [])
          .filter((item) => {
            if (!item || !item.code || !item.received_at) return false;
            const ms = new Date(item.received_at).getTime();
            return !isNaN(ms) && ms >= cutoff;
          })
          .sort((a, b) => new Date(b.received_at).getTime() - new Date(a.received_at).getTime());
      }

      function createCopySvg() {
        const ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("width", "18");
        svg.setAttribute("height", "18");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "2.2");
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");
        svg.setAttribute("aria-hidden", "true");
        const rect = document.createElementNS(ns, "rect");
        rect.setAttribute("x", "9");
        rect.setAttribute("y", "9");
        rect.setAttribute("width", "13");
        rect.setAttribute("height", "13");
        rect.setAttribute("rx", "2");
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", "M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1");
        svg.appendChild(rect);
        svg.appendChild(path);
        return svg;
      }

      async function copyText(text, btn, labelEl, originalText) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          }
          const t = I18N[state.lang];
          labelEl.textContent = t.copied;
          btn.classList.add("btn-copied");
          clearTimeout(btn._copyTimer);
          btn._copyTimer = setTimeout(() => {
            labelEl.textContent = originalText;
            btn.classList.remove("btn-copied");
          }, 2000);
        } catch (_) {}
      }

      function renderCodes() {
        if (!state.loadedOnce) return;
        const container = $("codesContainer");
        const t = I18N[state.lang];
        const active = getActiveCodes();

        container.innerHTML = "";

        const stage = document.createElement("div");
        stage.className = "otp-stage";

        const head = document.createElement("div");
        head.className = "otp-head";

        const label = document.createElement("p");
        label.className = "otp-stage-label";
        label.textContent = active.length > 0 ? t.latestOtpLabel : t.waitingOtpLabel;

        const sender = document.createElement("span");
        sender.className = "otp-sender mono";
        sender.textContent = t.senderTag;

        head.appendChild(label);
        head.appendChild(sender);
        stage.appendChild(head);

        if (active.length === 0) {
          const boxRow = document.createElement("div");
          boxRow.className = "otp-copy-row waiting";

          const placeholder = document.createElement("div");
          placeholder.className = "otp-digits placeholder";
          placeholder.textContent = "— — — — —";

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn btn-primary";
          btn.disabled = true;
          btn.appendChild(createCopySvg());
          const span = document.createElement("span");
          span.textContent = t.waitingBtn;
          btn.appendChild(span);

          boxRow.appendChild(placeholder);
          boxRow.appendChild(btn);

          const p1 = document.createElement("p");
          p1.className = "empty-helper";
          p1.textContent = t.emptyPrimary;

          stage.appendChild(boxRow);
          stage.appendChild(p1);
          container.appendChild(stage);
          return;
        }

        const latest = active[0];

        const boxRow = document.createElement("div");
        boxRow.className = "otp-copy-row";

        const digits = document.createElement("div");
        digits.className = "otp-digits";
        digits.textContent = String(latest.code).trim();

        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "btn btn-primary";
        copyBtn.appendChild(createCopySvg());
        const copyLabel = document.createElement("span");
        copyLabel.textContent = t.copyOtp;
        copyBtn.appendChild(copyLabel);
        copyBtn.addEventListener("click", () => {
          copyText(String(latest.code).trim(), copyBtn, copyLabel, t.copyOtp);
        });

        boxRow.appendChild(digits);
        boxRow.appendChild(copyBtn);

        const meta = document.createElement("div");
        meta.className = "otp-meta";

        const timeSpan = document.createElement("span");
        timeSpan.className = "mono";
        timeSpan.textContent = formatUtcTimestamp(latest.received_at);
        meta.appendChild(timeSpan);

        const sep = document.createElement("span");
        sep.className = "sep";
        sep.setAttribute("aria-hidden", "true");
        sep.textContent = "·";
        meta.appendChild(sep);

        const relSpan = document.createElement("span");
        relSpan.dataset.relTime = latest.received_at;
        relSpan.textContent = formatRelative(latest.received_at);
        meta.appendChild(relSpan);

        stage.appendChild(boxRow);
        stage.appendChild(meta);
        container.appendChild(stage);

        if (active.length > 1) {
          const histHead = document.createElement("div");
          histHead.className = "history-header";
          histHead.textContent = t.recentHistory;
          container.appendChild(histHead);

          const ul = document.createElement("ul");
          ul.className = "codes-list";

          active.slice(1).forEach((item) => {
            const li = document.createElement("li");
            li.className = "code-item";

            const left = document.createElement("div");
            left.className = "code-left";

            const codeEl = document.createElement("div");
            codeEl.className = "code-value";
            codeEl.textContent = String(item.code).trim();

            const itemMeta = document.createElement("div");
            itemMeta.className = "code-meta";

            const tEl = document.createElement("span");
            tEl.className = "mono";
            tEl.textContent = formatUtcTimestamp(item.received_at);
            itemMeta.appendChild(tEl);

            const sEl = document.createElement("span");
            sEl.className = "sep";
            sEl.setAttribute("aria-hidden", "true");
            sEl.textContent = "·";
            itemMeta.appendChild(sEl);

            const rEl = document.createElement("span");
            rEl.dataset.relTime = item.received_at;
            rEl.textContent = formatRelative(item.received_at);
            itemMeta.appendChild(rEl);

            left.appendChild(codeEl);
            left.appendChild(itemMeta);

            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "btn";
            btn.appendChild(createCopySvg());
            const bSpan = document.createElement("span");
            bSpan.textContent = t.copy;
            btn.appendChild(bSpan);
            btn.addEventListener("click", () => {
              copyText(String(item.code).trim(), btn, bSpan, t.copy);
            });

            li.appendChild(left);
            li.appendChild(btn);
            ul.appendChild(li);
          });

          container.appendChild(ul);
        }
      }

      async function fetchFromGitHubApi() {
        if (Date.now() < state.apiRateLimitedUntil) return null;
        const headers = { "Accept": "application/vnd.github.v3.raw" };
        if (state.etag) headers["If-None-Match"] = state.etag;
        const res = await fetch(RAW_API_URL, { headers, cache: "no-store" });
        if (res.status === 304) return { unchanged: true };
        if (res.status === 403 || res.status === 429) {
          state.apiRateLimitedUntil = Date.now() + 10 * 60 * 1000;
          return null;
        }
        if (!res.ok) return null;
        const etag = res.headers.get("ETag");
        if (etag) state.etag = etag;
        return { data: await res.json() };
      }

      async function fetchFromLocal() {
        const res = await fetch(`${LOCAL_JSON_URL}?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return { data: await res.json() };
      }

      async function refreshCodes() {
        if (state.fetching) return;
        state.fetching = true;
        $("refreshIcon").classList.add("spin");

        try {
          let result = null;
          try {
            result = await fetchFromGitHubApi();
          } catch (_) {
            result = null;
          }
          if (!result) {
            result = await fetchFromLocal();
          }

          if (result && result.data) {
            const payload = result.data;
            if (typeof payload.ttl_minutes === "number") state.ttlMinutes = payload.ttl_minutes;
            state.codes = Array.isArray(payload.codes) ? payload.codes : [];
          }

          state.online = true;
          state.loadedOnce = true;
          state.lastRefreshed = new Date();
          state.secondsLeft = REFRESH_SECONDS;
          updateStatusUI();
          renderCodes();
        } catch (_) {
          state.online = false;
          state.loadedOnce = true;
          state.secondsLeft = REFRESH_SECONDS;
          updateStatusUI();
          renderCodes();
        } finally {
          state.fetching = false;
          $("refreshIcon").classList.remove("spin");
          restartProgressBar();
        }
      }

      $("themeToggle").addEventListener("click", () => {
        applyTheme(state.theme === "dark" ? "light" : "dark");
      });
      $("langEn").addEventListener("click", () => applyLanguage("en"));
      $("langBn").addEventListener("click", () => applyLanguage("bn"));
      $("refreshBtn").addEventListener("click", () => refreshCodes());

      setInterval(() => {
        if (document.hidden) return;
        if (!state.fetching) {
          state.secondsLeft -= 1;
          if (state.secondsLeft <= 0) {
            refreshCodes();
          } else {
            $("countdownText").textContent = I18N[state.lang].nextIn(state.secondsLeft);
          }
        }
        document.querySelectorAll("[data-rel-time]").forEach((el) => {
          el.textContent = formatRelative(el.dataset.relTime);
        });
      }, 1000);

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          refreshCodes();
        }
      });

      applyTheme(state.theme);
      applyLanguage(state.lang);
      refreshCodes();
    })();
  </script>
</body>
</html>
